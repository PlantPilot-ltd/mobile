name: core_ui
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: 0.20.3

  provider: 6.1.5+1
  
  shared_preferences: 2.5.6

  mobx: 2.7.0
  flutter_mobx: 2.4.0

  dotted_border: 3.1.0
  auto_size_text_field: 2.3.0

dev_dependencies:
  flutter_lints: 6.0.0
  icon_font_generator: 4.1.0

flutter:
  assets:
    - lib/assets/
    - lib/assets/icons/
    - lib/assets/images/
  fonts:
    - family: SFUIText
      fonts:
        - asset: lib/assets/fonts/SFUIText-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/SFUIText-Heavy.ttf
          weight: 800
        - asset: lib/assets/fonts/SFUIText-Semibold.ttf
          weight: 600
        - asset: lib/assets/fonts/SFUIText-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/SFUIText-Regular.ttf
          weight: 400
          style: normal
        - asset: lib/assets/fonts/SFUIText-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/SFUIText-UltraLight.ttf
          weight: 200
    - family: Papillon
      fonts:
        - asset: lib/assets/fonts/Papillon.ttf
          weight: 400
          style: normal
    - family: CoreUIIcons
      fonts:
        - asset: lib/assets/fonts/CoreUIIcons.otf

icon_font:
  input_svg_dir: "lib/assets/icons"
  output_font_file: "lib/assets/fonts/CoreUIIcons.otf"
  
  output_class_file: "lib/directories/core_ui_icons.dart"
  class_name: "CoreUIIcons"
  package: core_ui
  format: true

  font_name: "CoreUIIcons"
  normalize: true
  ignore_shapes: true

  recursive: false
  verbose: false
