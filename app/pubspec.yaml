name: app
description: "Plant Pilot mobile app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3
  
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: 1.8.0
  cupertino_ui: 1.1.4
  
  core:
    path: ../core
  core_ui:
    path: ../core_ui
  shared_utils:
    path: ../shared_utils

  intl: 0.20.3

  provider: 6.1.5+1
  path_provider: 2.1.6
  
  get_it: 9.3.0
  
  go_router: 18.1.2
  
  shared_preferences: 2.5.6
  sembast: 3.9.0

  collection: 1.19.1
  equatable: 3.0.0

  flutter_blue_plus: 2.3.14
  app_settings: 9.0.1

  http: 1.6.0
  http_interceptor: 3.0.0

  lottie: 3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: 2.16.1
  mobx_codegen: 2.8.0
  
  flutter_lints: 6.0.0
  
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/animations/
    - assets/images/
  fonts:
    - family: SFUIText
      fonts:
        - asset: packages/core_ui/assets/fonts/SFUIText-Bold.ttf
          weight: 700
        - asset: packages/core_ui/assets/fonts/SFUIText-Heavy.ttf
          weight: 800
        - asset: packages/core_ui/assets/fonts/SFUIText-Semibold.ttf
          weight: 600
        - asset: packages/core_ui/assets/fonts/SFUIText-Medium.ttf
          weight: 500
        - asset: packages/core_ui/assets/fonts/SFUIText-Regular.ttf
          weight: 400
          style: normal
        - asset: packages/core_ui/assets/fonts/SFUIText-Light.ttf
          weight: 300
        - asset: packages/core_ui/assets/fonts/SFUIText-UltraLight.ttf
          weight: 200
    - family: Papillon
      fonts:
        - asset: packages/core_ui/assets/fonts/Papillon.ttf
          weight: 400
          style: normal
    - family: CoreUIIcons
      fonts:
        - asset: packages/core_ui/assets/fonts/CoreUIIcons.otf
